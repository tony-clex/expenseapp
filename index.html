<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div class="input-section">
            <div class="input-contain">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Salary, Groceries, etc.">
            </div>

            <div class="input-contain">
                <label for="amount">Amount (use negative for expenses)</label>
                <input type="number" id="amount" placeholder="10000 or -5000">
            </div>

            <button id="add-btn">Add Transaction</button>
        </div>

        <div id="confirm-modal" class="modal hidden">
            <div class="modal-content">
                <p id="confirm-text"></p>
                <div class="modal-buttons">
                    <button id="confirm-yes">Yes</button>
                    <button id="confirm-no">No</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <h2>Transaction History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transaction-list"></tbody>
            </table>
        </div>

        <div class="account-summary">
            <h2>Budget Summary</h2>
            <p>Total Income: <span id="total-income">0</span></p>
            <p>Total Expenses: <span id="total-expenses">0</span></p>
            <p>Balance: <span id="balance">0</span></p>
        </div>

        <button class="clear-btn" id="clear-all-btn">Clear All</button>
    </div>

    <div id="toast-container"></div>

    <script src="main.js"></script>
</body>

</html>
